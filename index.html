<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>VESSEL — Chapter 1</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23090b0e'/%3E%3Ccircle cx='16' cy='15' r='4' fill='%23e8edf5'/%3E%3C/svg%3E" />
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      body {
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        color: #cfd4dc;
        -webkit-font-smoothing: antialiased;
      }
      #viewport { position: fixed; inset: 0; display: block; }
      #viewport canvas { display: block; width: 100%; height: 100%; }
      #ui-root { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
      #debug-root { position: fixed; inset: 0; pointer-events: none; z-index: 20; }
      /* Boot screen — replaced once the engine takes over. */
      #boot {
        position: fixed; inset: 0; z-index: 100;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; background: #000; transition: opacity 700ms ease;
      }
      #boot.hidden { opacity: 0; pointer-events: none; }
      #boot .mark {
        font-size: 13px; letter-spacing: 0.72em; text-indent: 0.72em;
        color: #6e7480; font-weight: 400;
      }
      #boot .bar { width: 180px; height: 1px; background: #1c1f26; overflow: hidden; }
      #boot .bar > i { display: block; height: 100%; width: 0%; background: #8b93a1; transition: width 220ms ease; }
      #boot .status { font-size: 10px; letter-spacing: 0.22em; color: #3d424c; min-height: 1em; }
      #boot .error { color: #b4564f; letter-spacing: 0.04em; max-width: 46ch; text-align: center; line-height: 1.7; }
    </style>
  </head>
  <body>
    <div id="viewport"></div>
    <div id="ui-root"></div>
    <div id="debug-root"></div>
    <div id="boot">
      <div class="mark">VESSEL</div>
      <div class="bar"><i id="boot-bar"></i></div>
      <div class="status" id="boot-status">waking</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
